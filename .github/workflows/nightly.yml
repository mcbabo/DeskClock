name: Nightly Build

on:
  push:
    branches:
      - master

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      versionCode: ${{ steps.versioncode.outputs.versionCode }}
      versionName: ${{ steps.versionname.outputs.versionName }}
      shortSha: ${{ steps.sha.outputs.shortSha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Get versionCode
        id: versioncode
        run: echo "versionCode=$(grep -E '^\s+versionCode\s*=' app/build.gradle.kts | awk '{ print $3 }' | head -n 1)" >> $GITHUB_OUTPUT
      - name: Get versionName
        id: versionname
        run: echo "versionName=$(grep -E '^\s+versionName\s*=' app/build.gradle.kts | head -1 | awk -F\" '{ print $2 }')" >> $GITHUB_OUTPUT
      - name: Get Short Commit Hash
        id: sha
        run: echo "shortSha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  nightly:
    needs: [ prepare ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.versionName }}-${{ needs.prepare.outputs.versionCode }}-${{ needs.prepare.outputs.shortSha }}
      VERSION: ${{ needs.prepare.outputs.versionName }}-${{ needs.prepare.outputs.versionCode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android-keystore.jks

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Generate Checksums & Release Body
        id: release_body
        run: |
          cd app/build/outputs/apk/release
          sha256sum DeskClock-*.apk > checksums.txt
          cd -

          {
            echo "body<<EOF"
            echo "Automated rolling build from the latest master branch commit."
            echo ""
            echo "### Checksums"
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            for apk in app/build/outputs/apk/release/DeskClock-*.apk; do
              if [ -f "$apk" ]; then
                filename=$(basename "$apk")
                hash=$(sha256sum "$apk" | awk '{print $1}')
                echo "| \`$filename\` | \`$hash\` |"
              fi
            done
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Nightly Pre-Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION }} Nightly Release
          body: ${{ steps.release_body.outputs.body }}
          files: |
            app/build/outputs/apk/release/DeskClock-*.apk
            app/build/outputs/apk/release/checksums.txt
          prerelease: true